title: "NFL Game Outcome Prediction Using Team Performance Metrics"

short_summary: >
  Built machine learning models to predict NFL game outcomes and point
  differentials using team-level performance statistics. Engineered
  rolling features to capture recent team form and compared Logistic
  Regression and Random Forest models to evaluate predictive performance.

tech_stack:
  - Python
  - pandas
  - scikit-learn
  - matplotlib
  - great_tables
  - Jupyter Notebooks

problem_statement: >
  Predicting NFL game outcomes is challenging due to variability in team
  performance, injuries, and game context. The goal of this project was
  to determine whether recent team performance metrics — such as offensive
  efficiency, defensive strength, and turnover rates — can be used to
  reliably predict game winners and point differentials.

approach: >
  Collected NFL play-by-play data using nfl_data_py and aggregated it to
  the team-game level. Engineered rolling statistics over the previous
  10 games (e.g., EPA per play, success rate, point differential, and
  turnovers) to capture recent team performance. Created matchup features
  by taking differences between home and away teams (e.g., home − away).
  Trained both Logistic Regression and Random Forest classifiers to
  predict game outcomes, and a regression model to predict point
  differentials. Evaluated models using accuracy and ROC-AUC, and
  visualized results using Great Tables and matplotlib.

results_impact: >
  Logistic Regression performed competitively with — and in some cases
  outperformed — Random Forest, suggesting that the engineered difference
  features capture much of the underlying signal in a linear form.
  The model achieved strong predictive performance on test data and
  provided interpretable insights into which factors most influence game
  outcomes. Team-specific analysis (e.g., Detroit Lions) revealed that
  the model tends to overestimate strong teams, highlighting the
  limitations of purely statistical approaches in accounting for game-level
  randomness and contextual factors.

